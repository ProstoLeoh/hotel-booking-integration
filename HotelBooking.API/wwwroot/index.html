<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование отелей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f7; font-family: 'Segoe UI', sans-serif; padding-bottom: 40px; }
        .card-room { border-radius: 20px; transition: 0.2s; height: 100%; }
        .booking-card { background: white; border-left: 5px solid #0d6efd; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .nav-pills .nav-link { font-size: 1.2rem; font-weight: 600; cursor: pointer; }
        .badge-count { background: #dc3545; border-radius: 30px; padding: 2px 8px; font-size: 13px; color: white; margin-left: 8px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="mb-4">🏨 Бронирование отелей</h2>

    <!-- Кнопки переключения вкладок (работают без бутстрап-скриптов) -->
    <ul class="nav nav-pills mb-4">
        <li class="nav-item"><a class="nav-link active" id="btnRooms" href="#" onclick="switchTab('rooms'); return false;">🏠 Доступные номера</a></li>
        <li class="nav-item"><a class="nav-link" id="btnBookings" href="#" onclick="switchTab('bookings'); return false;">📋 Мои бронирования <span id="bookingsCount" class="badge-count">0</span></a></li>
    </ul>

    <!-- Вкладка: номера -->
    <div id="tabRooms" class="tab-pane active">
        <div class="row mb-3">
            <div class="col-md-4"><label class="form-label">📅 Заезд</label><input type="date" id="checkIn" class="form-control" value="2026-06-10"></div>
            <div class="col-md-4"><label class="form-label">📅 Выезд</label><input type="date" id="checkOut" class="form-control" value="2026-06-15"></div>
            <div class="col-md-4 d-flex align-items-end"><button class="btn btn-outline-secondary w-100" onclick="loadRooms()">🔄 Обновить</button></div>
        </div>
        <div id="roomsContainer" class="row">Загрузка номеров...</div>
    </div>

    <!-- Вкладка: мои брони -->
    <div id="tabBookings" class="tab-pane">
        <div id="bookingsContainer">Загрузка броней...</div>
    </div>
</div>

<script>
    const API_BASE = '/api/Booking';

    function switchTab(tab) {
        // переключение вкладок
        document.getElementById('tabRooms').classList.remove('active');
        document.getElementById('tabBookings').classList.remove('active');
        document.getElementById('btnRooms').classList.remove('active');
        document.getElementById('btnBookings').classList.remove('active');
        if (tab === 'rooms') {
            document.getElementById('tabRooms').classList.add('active');
            document.getElementById('btnRooms').classList.add('active');
        } else {
            document.getElementById('tabBookings').classList.add('active');
            document.getElementById('btnBookings').classList.add('active');
            loadBookings();  // каждый раз загружаем свежие брони
        }
    }

    function getNights() {
        const from = new Date(document.getElementById('checkIn').value);
        const to = new Date(document.getElementById('checkOut').value);
        return Math.max(1, Math.ceil((to - from) / (1000*60*60*24)));
    }

    async function loadRooms() {
        try {
            const res = await fetch(`${API_BASE}/rooms`);
            const rooms = await res.json();
            renderRooms(rooms);
        } catch(e) {
            document.getElementById('roomsContainer').innerHTML = '<div class="alert alert-danger">Ошибка загрузки номеров</div>';
        }
    }

    function renderRooms(rooms) {
        const container = document.getElementById('roomsContainer');
        if (!rooms.length) {
            container.innerHTML = '<div class="alert alert-warning">Нет доступных номеров</div>';
            return;
        }
        container.innerHTML = '';
        rooms.forEach(room => {
            const nights = getNights();
            const total = room.pricePerNight * nights;
            container.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="card card-room">
                        <div class="card-body">
                            <h5>${room.type === 'double' ? '🛏️ Двухместный' : '🛏️ Люкс'}</h5>
                            <p>💰 ${room.pricePerNight} ₽/ночь<br>👥 ${room.capacity} чел<br>📆 ${nights} ночей<br>💵 <strong>${total} ₽</strong></p>
                            <button class="btn btn-primary w-100" onclick='bookRoom("${room.roomId}", ${room.pricePerNight})'>Забронировать</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    async function bookRoom(roomId, pricePerNight) {
        const guestName = prompt("Введите ваше имя", "Иван Петров");
        if (!guestName) return;
        const guestEmail = prompt("Введите email", "ivan@example.com");
        if (!guestEmail) return;
        const checkIn = document.getElementById('checkIn').value;
        const checkOut = document.getElementById('checkOut').value;
        const nights = getNights();
        const totalAmount = pricePerNight * nights;

        const payload = { roomId, guestName, guestEmail, checkIn, checkOut };
        try {
            const res = await fetch(`${API_BASE}/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert(`✅ Бронирование успешно! Сумма: ${data.totalAmount} ₽`);
                await loadBookings();          // обновляем список броней
                switchTab('bookings');         // переключаем на вкладку броней
            } else {
                alert(`❌ Ошибка: ${data.error}`);
            }
        } catch(e) {
            alert("❌ Ошибка соединения с сервером");
        }
    }

    async function loadBookings() {
        try {
            const res = await fetch(`${API_BASE}/bookings`);
            const bookings = await res.json();
            const container = document.getElementById('bookingsContainer');
            const countSpan = document.getElementById('bookingsCount');
            countSpan.innerText = bookings.length;
            if (!bookings.length) {
                container.innerHTML = '<div class="alert alert-secondary">📭 Нет бронирований. Перейдите во вкладку "Номера" и забронируйте.</div>';
                return;
            }
            let html = '';
            bookings.forEach(b => {
                const nights = Math.ceil((new Date(b.checkOut) - new Date(b.checkIn)) / (1000*60*60*24));
                html += `
                    <div class="booking-card">
                        <strong>🏷️ ${b.bookingId.slice(0,8)}</strong><br>
                        👤 ${b.guestName} (${b.guestEmail})<br>
                        📅 ${b.checkIn} — ${b.checkOut} (${nights} ночей)<br>
                        💰 ${b.totalAmount} ₽<br>
                        ✅ Статус: ${b.status}
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch(e) {
            document.getElementById('bookingsContainer').innerHTML = '<div class="alert alert-danger">Ошибка загрузки броней</div>';
        }
    }

    document.getElementById('checkIn').addEventListener('change', loadRooms);
    document.getElementById('checkOut').addEventListener('change', loadRooms);
    loadRooms(); loadBookings();
    loadBookings();
</script>
</body>
</html>
