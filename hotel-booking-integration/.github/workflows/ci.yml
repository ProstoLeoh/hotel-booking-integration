name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile app.py

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: node -c server.js

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Check syntax
        run: go build -o /dev/null ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-python, test-node, test-go]
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker images
        run: |
          docker build -f Dockerfile.python -t room-service .
          docker build -f Dockerfile.node -t booking-service .
          docker build -f Dockerfile.go -t payment-service .
      - name: Docker Compose up
        run: docker-compose up -d
      - name: Wait for services
        run: sleep 10
      - name: Test services
        run: |
          curl -f http://localhost:5001/rooms || exit 1
          curl -f http://localhost:5002/bookings || exit 1
          curl -f http://localhost:5003/payments || exit 1
      - name: Docker logs
        if: always()
        run: docker-compose logs
